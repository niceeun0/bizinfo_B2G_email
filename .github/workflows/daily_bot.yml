name: B2G AI Newsletter Bot

on:
  schedule:
    - cron: '30 21 * * *' # 매일 아침 자동 실행 (UTC 기준, 한국 시간 오전 6시 30분)
  workflow_dispatch: # 수동 실행 버튼 제공

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (OCR & Image tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openai pdfplumber docx olefile pytesseract Pillow pandas openpyxl urllib3

      - name: Run bot script
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bizinfo_bot.py
