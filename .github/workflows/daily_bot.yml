name: Bizinfo B2G Daily Email Bot

on:
  schedule:
    # 매일 아침 8시 30분 (KST) 자동 실행 (UTC 23:30)
    - cron: '30 23 * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 버튼 눌러 즉시 실행 가능하도록 설정

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install requests pdfplumber urllib3

      - name: 자동화 봇 실행
        env:
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python bizinfo_bot.py
